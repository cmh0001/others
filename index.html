<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工作日历</title>
    <style>
    * {
        box-sizing: border-box;
        font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
        margin: 0;
        padding: 0;
    }

    body {
        background: rgba(236, 240, 245, 0.6);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        backdrop-filter: blur(4px);
    }

    /* ================= 主容器 ================= */
    .calendar-pro {
        width: 100%;
        max-width: 1080px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 48px;
        box-shadow: 0 30px 60px -25px rgba(0, 20, 60, 0.4);
        border: 1px solid rgba(255,255,255,0.7);
        padding: 12px 20px;
    }

    /* ================= 顶部 ================= */
    .cal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
        padding: 0 6px;
    }

    .month-nav {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .month-nav button {
        width: 45px;
        height: 45px;
        border-radius: 40px;
        border: none;
        background: rgba(215, 228, 245, 0.8);
        font-size: 28px;
        color: #133c5e;
        cursor: pointer;
        border: 1px solid white;
        transition: 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .month-nav button:hover {
        background: #bdd2f0;
        transform: scale(1.03);
    }

    #currentMonthDisplay {
        font-size: 1.5rem;
        font-weight: 500;
        color: #0b263f;
        min-width: 120px;
        text-align: center;
    }

    /* ================= 星期 ================= */
    .week-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        background: rgba(225, 235, 250, 0.7);
        padding: 4px 0 3px;
        border-radius: 40px;
        margin-bottom: 12px;
        font-weight: 560;
        font-size: 1.1rem;
        color: #1d3f64;
        border: 1px solid white;
    }

    /* ================= 日期网格 ================= */
    .days-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
    }

    .day-card {
        aspect-ratio: 1 / 0.75;
        min-height: 70px;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(2px);
        border-radius: 20px;
        padding: 4px 4px 2px 6px;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255,255,255,0.9);
        box-shadow: 0 4px 12px -8px rgba(0,0,0,0.15);
        transition: 0.1s;
        cursor: pointer;
    }

    .day-card:hover {
        background: white;
        border-color: #9bb9e8;
        transform: translateY(-2px);
    }

    .other-month {
        background: rgba(230, 235, 245, 0.5);
        color: #5f6a80;
        border-color: rgba(210,220,240,0.6);
    }

    .today-card {
        border: 3px solid #1d6df0;
        background: #ecf3ff;
    }

    .selected-card {
        border: 3px solid #f09b1d;
        background: #fff6e0;
    }

    .rest-day {
        background: #e6f0d8;
        border-color: #b3d0a2;
    }

    .rest-day .day-number {
        color: #1f5a2e;
        font-weight: 600;
    }

    .working-saturday {
        background: #dbeafe;
        border-color: #9bbaf0;
    }

    .working-saturday .day-number {
        color: #104079;
        font-weight: 600;
    }

    .legal-holiday {
        background: #fee2e2 !important;
        border-color: #f87171 !important;
    }

    .legal-holiday .day-number {
        color: #b91c1c !important;
        font-weight: 700;
    }

    /* ================= 文本 ================= */
    .day-number {
        font-size: 1.4rem;
        font-weight: 470;
        line-height: 1.2;
    }

    .lunar-text {
        font-size: 0.75rem;
        color: #4a5f7a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
        background: rgba(255,255,255,0.5);
        padding: 2px 4px;
        border-radius: 12px;
        text-align: center;
    }

    .work-tag {
        font-size: 0.7rem;
        color: #0066cc;
        font-weight: bold;
        margin-top: 2px;
        text-align: center;
    }

    .note-tag {
        font-size: 0.7rem;
        background: rgba(45, 110, 210, 0.1);
        padding: 2px 4px;
        border-radius: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #14477c;
        margin-top: 3px;
        text-align: center;
    }

    /* ================= 底部 ================= */
    .note-footer {
        margin-top: 16px;
        background: #f4f9ff;
        border-radius: 40px;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        border: 1px solid white;
    }

    .selected-date-badge {
        background: #d6e4f5;
        padding: 8px 20px;
        border-radius: 40px;
        font-size: 1.1rem;
        font-weight: 500;
        color: #022140;
        white-space: nowrap;
    }

    .note-editor {
        flex: 1;
        display: flex;
        gap: 12px;
        min-width: 0;
    }

    #noteInput {
        flex: 1;
        padding: 10px 18px;
        border: none;
        border-radius: 36px;
        background: white;
        font-size: 1rem;
        border: 1px solid #b9cee8;
        outline: none;
    }

    #noteInput:focus {
        border-color: #1d6df0;
        box-shadow: 0 0 0 4px #b1d0ff;
    }

    #saveNoteBtn {
        background: #1d6df0;
        color: white;
        border: none;
        padding: 0 28px;
        border-radius: 36px;
        font-size: 1rem;
        font-weight: 530;
        cursor: pointer;
        border: 1px solid rgba(255,255,255,0.4);
        transition: 0.15s;
    }

    #saveNoteBtn:hover {
        background: #0e4db0;
    }

    /* ================= 图例 ================= */
    .legend-panel {
        display: flex;
        gap: 20px;
        margin: 12px 0 16px;
        font-size: 0.95rem;
        color: #1e4b77;
        flex-wrap: wrap;
        align-items: center;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .legend-color {
        width: 20px;
        height: 20px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.08);
    }

    .legend-color.rest { background: #e6f0d8; }
    .legend-color.work-sat { background: #dbeafe; }
    .legend-color.holiday { background: #fee2e2; border-color: #f87171; }

     /*==================== 手机适配 ==================== */
    @media (max-width: 768px) {

        /* 取消居中 */
        body {
            display: block;
            padding: 8px;
            min-height: auto;
        }

        html, body {
            height: auto;
        }

        .calendar-pro {
            border-radius: 24px;
            padding: 10px;
            margin: 0 auto;
        }

        /* 星期栏缩小 */
        .week-grid {
            font-size: 0.9rem;
            padding: 2px 0;
        }

        /* 🔥 核心：让格子完全自适应屏幕 */
        .days-grid {
            gap: 4px;
        }

        .day-card {
            aspect-ratio: unset;          /* 取消固定比例 */
            height: calc((100vw - 40px) / 7);
            min-height: unset;
            padding: 2px;
            border-radius: 14px;
        }

        .day-number {
            font-size: 0.8rem;
            line-height: 1;
        }

        .lunar-text {
            font-size: 0.6rem;
            margin-top: 1px;
            padding: 1px 3px;
        }

        .note-tag {
            font-size: 0.55rem;
            margin-top: 1px;
        }

        .work-tag {
            font-size: 0.55rem;
            margin-top: 1px;
        }

        .month-nav button {
            width: 32px;
            height: 32px;
            font-size: 18px;
        }

        #currentMonthDisplay {
            font-size: 1.1rem;
        }

        /* 底部改为竖排 */
        .note-footer {
            flex-direction: column;
            align-items: stretch;
            border-radius: 20px;
            padding: 10px;
            gap: 10px;
        }

        .selected-date-badge {
            font-size: 0.95rem;
            padding: 6px 10px;
            text-align: center;
            width: 100%;
        }

        #noteInput {
            font-size: 0.9rem;
            padding: 8px 14px;
        }

        #saveNoteBtn {
            padding: 8px;
            font-size: 0.9rem;
        }
    }
    </style>
</head>
<body>
<div class="calendar-pro">
    <div class="cal-header">
        <div class="month-nav">
            <button id="prevMonthBtn">←</button>
            <span id="currentMonthDisplay" style="display: flex; align-items: center; gap: 12px;"></span>
            <button id="nextMonthBtn">→</button>
        </div>
    </div>

    <div class="week-grid">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>

    <div id="daysGrid" class="days-grid"></div>

    <div class="legend-panel">
        <div class="legend-item"><span class="legend-color rest"></span> 休息日</div>
        <div class="legend-item"><span class="legend-color work-sat"></span> 上班周六</div>
        <div class="legend-item"><span class="legend-color holiday"></span> 法定节假日</div>
        <div style="margin-left: auto;">📝 点击格子添加备注</div>
    </div>

    <div class="note-footer">
        <div class="selected-date-badge" id="selectedDateDisplay">未选中日期</div>
        <div class="note-editor">
            <input type="text" id="noteInput" placeholder="写备注...">
            <button id="saveNoteBtn">保存</button>
        </div>
    </div>
</div>

<script>
(function() {
    let currentDisplayDate = new Date();
    currentDisplayDate.setDate(1);

    let selectedKey = (() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    })();

    let notes = JSON.parse(localStorage.getItem('sizeWeekNotes') || '{}');

    // ==================== 稳定农历算法（来自chatgpt）====================
    const lunarInfo = [
        0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2,
        0x04ae0, 0x0a5b6, 0x0a4d0, 0x0d250, 0x1d255, 0x0b540, 0x0d6a0, 0x0ada2, 0x095b0, 0x14977,
        0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970,
        0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950,
        0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x0b557,
        0x06ca0, 0x0b550, 0x15355, 0x04da0, 0x0a5d0, 0x14573, 0x052d0, 0x0a9a8, 0x0e950, 0x06aa0,
        0x0aea6, 0x0ab50, 0x04b60, 0x0aae4, 0x0a570, 0x05260, 0x0f263, 0x0d950, 0x05b57, 0x056a0,
        0x096d0, 0x04dd5, 0x04ad0, 0x0a4d0, 0x0d4d4, 0x0d250, 0x0d558, 0x0b540, 0x0b6a0, 0x195a6,
        0x095b0, 0x049b0, 0x0a974, 0x0a4b0, 0x0b27a, 0x06a50, 0x06d40, 0x0af46, 0x0ab60, 0x09570,
        0x04af5, 0x04970, 0x064b0, 0x074a3, 0x0ea50, 0x06b58, 0x05ac0, 0x0ab60, 0x096d5, 0x092e0,
        0x0c960, 0x0d954, 0x0d4a0, 0x0da50, 0x07552, 0x056a0, 0x0abb7, 0x025d0, 0x092d0, 0x0cab5,
        0x0a950, 0x0b4a0, 0x0baa4, 0x0ad50, 0x055d9, 0x04ba0, 0x0a5b0, 0x15176, 0x052b0, 0x0a930,
        0x07954, 0x06aa0, 0x0ad50, 0x05b52, 0x04b60, 0x0a6e6, 0x0a4e0, 0x0d260, 0x0ea65, 0x0d530,
        0x05aa0, 0x076a3, 0x096d0, 0x04bd7, 0x04ad0, 0x0a4d0, 0x1d0b6, 0x0d250, 0x0d520, 0x0dd45,
        0x0b5a0, 0x056d0, 0x055b2, 0x049b0, 0x0a577, 0x0a4b0, 0x0aa50, 0x1b255, 0x06d20, 0x0ada0
    ];

    function getLunar(date) {
        let baseDate = new Date(1900, 0, 31);
        let offset = Math.floor((date - baseDate) / 86400000);
        let year, month, day;

        for (year = 1900; year < 2100 && offset > 0; year++) {
            offset -= yearDays(year);
        }
        if (offset < 0) {
            offset += yearDays(--year);
        }

        let leap = leapMonth(year);
        let isLeap = false;

        for (month = 1; month <= 12 && offset >= 0; month++) {
            let days = isLeap ? leapDays(year) : monthDays(year, month);
            if (offset < days) break;
            offset -= days;
            if (leap && month === leap && !isLeap) {
                isLeap = true;
                month--;
            } else if (isLeap) {
                isLeap = false;
            }
        }
        day = offset + 1;

        const monthNames = ["正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "腊"];
        const dayNames = ["初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十",
            "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十",
            "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"];

        let monthStr = monthNames[(month - 1 + 12) % 12];
        return (isLeap ? "闰" : "") + monthStr + "月" + dayNames[day - 1];
    }

    function yearDays(y) {
        let sum = 348;
        for (let i = 0x8000; i > 0x8; i >>= 1)
            sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
        return sum + leapDays(y);
    }

    function leapMonth(y) {
        return lunarInfo[y - 1900] & 0xf;
    }

    function leapDays(y) {
        if (leapMonth(y))
            return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
        return 0;
    }

    function monthDays(y, m) {
        return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29;
    }

    // ==================== 大小周判定 ====================
    const anchor = new Date(2026, 1, 28); // 2026-02-28 是上班周六

    function weekIndex(date) {
        let monday = new Date(date);
        monday.setDate(date.getDate() - ((date.getDay() + 6) % 7));
        let anchorMonday = new Date(anchor);
        anchorMonday.setDate(anchor.getDate() - ((anchor.getDay() + 6) % 7));
        return Math.floor((monday - anchorMonday) / 604800000);
    }

    function isWorkSaturday(date) {
        return date.getDay() === 6 && weekIndex(date) % 2 === 0;
    }

    function getBaseDayType(year, month, day) {
        let date = new Date(year, month-1, day);
        let wd = date.getDay();
        if (wd === 0) return 'rest-day';
        if (wd === 6) {
            return isWorkSaturday(date) ? 'working-saturday' : 'rest-day';
        }
        return '';
    }

    // ==================== 法定节假日====================
    function getFestival(year, month, day, lunarStr){

        // ==== 真正节日本体 ====
        if (lunarStr === "正月初一") return "春节";

        // 除夕
        const tomorrow = new Date(year, month-1, day+1);
        const tomorrowLunar = getLunar(tomorrow);
        if (tomorrowLunar === "正月初一") return "除夕";

        if (lunarStr === "五月初五") return "端午";
        if (lunarStr === "八月十五") return "中秋";

        if (month === 4 && day === getQingMingDay(year)) return "清明";
        if (month === 1 && day === 1) return "元旦";
        if (month === 5 && day === 1) return "劳动节";
        if (month === 10 && day === 1) return "国庆";

        return "";
    }

    function isLegalHoliday(year, month, day, lunarStr){

        // 春节三天
        if (lunarStr === "正月初一" ||
            lunarStr === "正月初二" ||
            lunarStr === "正月初三") return true;

        // 除夕
        const tomorrow = new Date(year, month-1, day+1);
        const tomorrowLunar = getLunar(tomorrow);
        if (tomorrowLunar === "正月初一") return true;

        // 端午
        if (lunarStr === "五月初五") return true;

        // 中秋
        if (lunarStr === "八月十五") return true;

        // 清明
        if (month === 4 && day === getQingMingDay(year)) return true;

        // 元旦 1
        if (month === 1 && (day === 1 )) return true;

        // 五一 1-2
        if (month === 5 && (day === 1 || day === 2)) return true;

        // 国庆 1-3
        if (month === 10 && (day === 1 || day === 2 || day === 3)) return true;

        return false;
    }

    function getQingMingDay(year) {
        // 公式法（1900-2099有效）
        const C = 4.81;
        const Y = year % 100;
        return Math.floor(Y * 0.2422 + C) - Math.floor(Y / 4);
    }

    // ==================== 计算每月工作日天数 ====================
    function calculateWorkDays(year, month) {
        const daysInMonth = new Date(year, month, 0).getDate();
        let workDays = 0;

        // 第一步：按照大小周计算正常上班天数（不考虑法定假）
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month - 1, day);
            const wd = date.getDay();

            // 周日：休息
            if (wd === 0) {
                continue;
            }

            // 周六：根据大小周判断
            if (wd === 6) {
                if (isWorkSaturday(date)) {
                    workDays++;  // 大周上班周六，算工作日
                }
                // 小周周六休息，不算
                continue;
            }

            // 周一到周五：正常工作日
            workDays++;
        }

        // 第二步：统计本月法定节假日总天数（不管落在周几）
        let legalHolidayCount = 0;
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month - 1, day);
            const lunarStr = getLunar(date);

            if (isLegalHoliday(year, month, day, lunarStr)) {
                legalHolidayCount++;
            }
        }

        // 最终工作日 = 正常上班天数 - 法定节假日总天数
        return workDays - legalHolidayCount;
    }

    // ==================== 渲染 ====================
    function render() {
        const year = currentDisplayDate.getFullYear();
        const month = currentDisplayDate.getMonth() + 1;
        // 计算工作日天数
        const workDaysCount = calculateWorkDays(year, month);

        document.getElementById('currentMonthDisplay').innerHTML = `
            <span>${year}年${month}月</span>
            <span style="font-size: 0.9rem; font-weight: 400; color: #1d6df0; background: rgba(29,109,240,0.1); padding: 2px 14px; border-radius: 20px;">
                🏢 ${workDaysCount}个工作日
            </span>
        `;

        const firstDay = new Date(year, month-1, 1);
        let firstWeekday = firstDay.getDay();
        // 调整到周一为第一天：周一=0，周日=6
        let startOffset = firstWeekday === 0 ? 6 : firstWeekday - 1;
        const daysInMonth = new Date(year, month, 0).getDate();
        const prevMonthLast = new Date(year, month-1, 0).getDate();

        const today = new Date();
        const todayY = today.getFullYear(), todayM = today.getMonth()+1, todayD = today.getDate();

        let html = '';
        for (let i = 0; i < 42; i++) {
            let cellYear = year, cellMonth = month, cellDay;
            let isOther = false;

            if (i < startOffset) {
                isOther = true;
                cellDay = prevMonthLast - startOffset + i + 1;
                cellMonth = month - 1;
                if (cellMonth === 0) { cellMonth = 12; cellYear = year - 1; }
            } else if (i >= startOffset + daysInMonth) {
                isOther = true;
                let nextIdx = i - (startOffset + daysInMonth);
                cellDay = nextIdx + 1;
                cellMonth = month + 1;
                if (cellMonth === 13) { cellMonth = 1; cellYear = year + 1; }
            } else {
                cellDay = i - startOffset + 1;
            }

            const dateKey = `${cellYear}-${String(cellMonth).padStart(2,'0')}-${String(cellDay).padStart(2,'0')}`;
            const cellDate = new Date(cellYear, cellMonth-1, cellDay);

            let classes = 'day-card';
            if (isOther) classes += ' other-month';
            if (!isOther && cellYear === todayY && cellMonth === todayM && cellDay === todayD) classes += ' today-card';
            if (dateKey === selectedKey) classes += ' selected-card';

            let typeClass = getBaseDayType(cellYear, cellMonth, cellDay);
            if (typeClass) classes += ' ' + typeClass;

            const lunarStr = getLunar(cellDate);
            const festival = getFestival(cellYear, cellMonth, cellDay, lunarStr);

            if (isLegalHoliday(cellYear, cellMonth, cellDay, lunarStr)) {
                classes += " legal-holiday";
            }

            const isWorkSat = isWorkSaturday(cellDate);
            const note = notes[dateKey] || '';
            const shortNote = note.length > 6 ? note.slice(0,6)+'…' : note;

            html += `
                <div class="${classes}" data-key="${dateKey}">
                    <div class="day-number">${cellDay}</div>
                    <div class="lunar-text">${festival || lunarStr}</div>
                    ${isWorkSat ? '<div class="work-tag">班</div>' : ''}
                    ${note ? `<div class="note-tag">📌${shortNote}</div>` : ''}
                </div>
            `;
        }

        document.getElementById('daysGrid').innerHTML = html;
        updateFooter();
    }

    function updateFooter() {
        if (selectedKey) {
            let [y,m,d] = selectedKey.split('-').map(Number);
            document.getElementById('selectedDateDisplay').innerText = `${y}年${m}月${d}日`;
            document.getElementById('noteInput').value = notes[selectedKey] || '';
        } else {
            document.getElementById('selectedDateDisplay').innerText = '未选中日期';
            document.getElementById('noteInput').value = '';
        }
    }

    function saveNote() {
        if (!selectedKey) { alert('请点击一天'); return; }
        let val = document.getElementById('noteInput').value.trim();
        if (val === '') delete notes[selectedKey];
        else notes[selectedKey] = val;
        localStorage.setItem('sizeWeekNotes', JSON.stringify(notes));
        render();
    }

    // 事件绑定
    document.getElementById('daysGrid').addEventListener('click', (e) => {
        let card = e.target.closest('.day-card');
        if (!card) return;
        let key = card.dataset.key;
        if (key) { selectedKey = key; render(); }
    });

    document.getElementById('prevMonthBtn').addEventListener('click', () => {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() - 1);
        render();
    });
    document.getElementById('nextMonthBtn').addEventListener('click', () => {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() + 1);
        render();
    });
    document.getElementById('saveNoteBtn').addEventListener('click', saveNote);
    document.getElementById('noteInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') saveNote();
    });

    // 初始化渲染
    render();
})();
</script>
</body>
</html>
